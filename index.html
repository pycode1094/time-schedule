<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>종합시간표</title>
    <meta name="description" content="대한상공회의소 부산인력개발원 종합시간표: 강사 · 과정 · 강의실별 수업과 바뀐 수업을 확인해요." />
    <meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="종합시간표" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      // 저장된 화면 테마를 먼저 적용해 첫 화면 깜빡임을 막는다 (저장소 접근 실패는 무시)
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('ts:theme') || 'null');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            var c = t === 'dark' ? '#0F1115' : '#F2F4F6';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c); });
          }
        } catch (e) { /* 무시 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>이 사이트는 JavaScript 가 필요해요.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
